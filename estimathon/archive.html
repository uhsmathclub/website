<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estimathon · archive</title>
<link rel="icon" href="../assets/images/math-club.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 60rem; margin: 0 auto; width: 100%; display: grid; gap: 1.6rem; align-content: start; }
  .roomA { color: var(--a); } .roomB { color: var(--b); }

  .win { display: flex; align-items: center; gap: 1.1rem; }
  .win .sw { width: 3.2rem; height: 3.2rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 1.1rem; }
  .chips .tag b { color: var(--ink); font-weight: 640; }

  .q { display: grid; gap: .5rem; padding: 1.1rem 0; border-top: 1.5px solid var(--line); }
  .q:first-child { border-top: 0; }
  .qtop { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
  .qtop .chips { gap: .9rem; }
  .qtop .tag { font-size: 1rem; }
  .qtext { font-size: 1.15rem; }
  .qtext b { font-weight: 640; }
  .qcell.mini { width: 2.2rem; height: 2.2rem; border-radius: 10px; flex: none; }
  .qrow .rm { text-align: left; }
  .qrow { display: grid; grid-template-columns: 1.5rem auto 9rem 1fr; align-items: center; gap: .55rem; }
  .cgroup .qrow { grid-template-columns: auto auto auto auto; }
  .qrow .rk { color: var(--muted); font-size: .85rem; text-align: right; }
  .qrow .nm { font-weight: 540; }
  .qrow.a .nm { box-shadow: inset 0 -2px 0 var(--a); }
  .qrow.b .nm { box-shadow: inset 0 -2px 0 var(--b); }
  .qrow .iv { color: var(--muted); }

  .board { columns: 3 14rem; column-gap: 1.6rem; }
  .brow { break-inside: avoid; display: grid; grid-template-columns: 1.7rem auto 1fr auto; align-items: center; gap: .5rem; padding: .25rem 0; }
  .brow .rk { color: var(--muted); font-size: .85rem; text-align: right; }
  .brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow.a .nm { box-shadow: inset 0 -2px 0 var(--a); }
  .brow.b .nm { box-shadow: inset 0 -2px 0 var(--b); }
  .brow .sc { font-weight: 640; }

  .swatches { display: flex; flex-wrap: wrap; gap: 1.4rem; }
  .cgroup { display: grid; gap: .5rem; justify-items: start; }
  .cbig { width: 3.4rem; height: 3.4rem; border-radius: 50%; border: 3px solid var(--ink); }
  .cgroup .sw { border-width: 2.5px; border-color: var(--ink); }
  .rm { font-size: .85rem; }

  table.arch { border-collapse: collapse; width: 100%; max-width: 26rem; }
  table.arch th { text-align: left; font-size: .85rem; color: var(--muted); font-weight: 560; padding: .4rem .8rem .4rem 0; }
  table.arch td { padding: .4rem .8rem .4rem 0; border-top: 1.5px solid var(--line); }
</style>
</head>
<body>

<div class="topbar">
  <span class="me"><b>Estimathon</b><span class="tag" id="year"></span></span>
  <span id="themehost"></span>
</div>

<main>
  <section id="pending" hidden><h1>Not yet</h1></section>

  <section id="recap" hidden style="display:grid;gap:1.6rem">
    <div class="win">
      <span class="sw" id="wsw"></span>
      <div><h1 id="wname"></h1><p class="tag" id="wsub"></p></div>
    </div>

    <div class="chips" id="totals"></div>

    <div class="card">
      <p class="tag">Questions</p>
      <div id="qlist"></div>
    </div>

    <div class="card">
      <p class="tag">Leaderboard</p>
      <div class="board" id="board"></div>
    </div>

    <div class="card">
      <p class="tag">Colours</p>
      <div class="swatches" id="colors"></div>
    </div>
  </section>

  <div class="card">
    <p class="tag">Past winners</p>
    <table class="arch" id="arch"></table>
  </div>
</main>

<script type="module" src="archive.js"></script>
</body>
</html>
